name: Source checks
on: [push, pull_request]
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test test/plugin.test.mjs
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/test_export.py
      - run: python backend/test_getdata.py
      - run: python backend/test_refinement.py
      - run: python backend/self_test.py
      # CI has no GetData installation: self_test checks tool flow and mandatory refusal without GetData.
      # Actual desktop -> TXT -> Excel is tested locally with --getdata-exe PATH.
